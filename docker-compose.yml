services:
  mongodb:
    image: mongo:7
    container_name: fabrinova3d-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fabrinova3d_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fabrinova3d_mongodb_data:
